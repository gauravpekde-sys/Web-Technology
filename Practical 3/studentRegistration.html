<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Student Registration Form</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Student Information</legend>

                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>

                <label for="rollNo">Roll Number</label>
                <input type="text" id="rollNo" name="rollNo" placeholder="Enter college roll number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit mobile number" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label>Gender</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>

                <label for="department">Branch / Department</label>
                <select id="department" name="department" required>
                    <option value="">-- Select Branch --</option>
                    <option value="CT">Computer Technology</option>
                    <option value="IT">Information Technology</option>
                    <option value="AIDS">Artificial Intelligence and Data Science</option>
                    <option value="ETC">Electronics and Telecommunication</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                </select>

                <label for="address">Permanent Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>

                <div class="btn-group">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </div>
            </fieldset>
        </form>
    </div>

</body>
</html>
