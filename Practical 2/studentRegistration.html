<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Student Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #c3cfe2 0%, #c5d9ed 100%);
            margin: 0;
            padding: 30px 15px;
        }

        .form-container {
            max-width: 520px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-top: 5px solid #2980b9;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ecf0f1;
        }

        fieldset {
            border: 1.5px solid #bdc3c7;
            border-radius: 8px;
            padding: 18px;
            background-color: #fafbfc;
        }

        legend {
            font-weight: bold;
            color: #2980b9;
            padding: 4px 12px;
            background-color: #ebf5fb;
            border: 1px solid #d4e6f1;
            border-radius: 4px;
            font-size: 15px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #34495e;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 14px;
            background-color: #ffffff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            border-color: #2980b9;
            box-shadow: 0 0 5px rgba(41, 128, 185, 0.3);
            outline: none;
        }

        .gender-options {
            margin-top: 6px;
            background-color: #ffffff;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }

        .gender-options label {
            display: inline;
            font-weight: normal;
            margin-right: 18px;
            cursor: pointer;
            color: #2c3e50;
        }

        .gender-options input[type="radio"] {
            margin-right: 5px;
        }

        textarea {
            resize: vertical;
        }

        .btn-group {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }

        input[type="submit"] {
            flex: 1;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #219150;
        }

        input[type="reset"] {
            flex: 1;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Student Registration Form</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Student Information</legend>

                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>

                <label for="rollNo">Roll Number</label>
                <input type="text" id="rollNo" name="rollNo" placeholder="Enter college roll number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit mobile number" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label>Gender</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>

                <label for="department">Branch / Department</label>
                <select id="department" name="department" required>
                    <option value="">-- Select Branch --</option>
                    <option value="CT">Computer Technology</option>
                    <option value="IT">Information Technology</option>
                    <option value="AIDS">Artificial Intelligence and Data Science</option>
                    <option value="ETC">Electronics and Telecommunication</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                </select>

                <label for="address">Permanent Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>

                <div class="btn-group">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </div>
            </fieldset>
        </form>
    </div>

</body>
</html>
